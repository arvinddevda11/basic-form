<!DOCTYPE html>
<html lang="en">

<head>
  <title>Document</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <div class="form">
    <form>
      <fieldset>
        <legend>Biodata</legend>
        <br>
        <lebel>Name</lebel><input id="text" type="text" placeholder="Full Name"><br>
        <br>
        <lebel>Password</lebel><input id="password" type="password" placeholder=" password"><br>
        <br><label>Email</label> <input id="email" type="Email" placeholder="Email"><br>
        <br><label>Telephone</label> <input id="tel" type="tel" placeholder="Telephone"><br>
        <br><label>Search</label> <input id="search" type="search" placeholder="Search"><br>
        <br><label>Number</label> <input id="number" type="number" placeholder="Mobile"><br>
        <br><Label>Color</Label><input id="color" type="color" name="photo" placeholder="color"><br>
      </fieldset>

      <fieldset>
        <legend>Files</legend>
        <br><input id="file" type="file" placeholder="choose file"><br>
        <br><input id="image" type="image" placeholder="image"><br>
      </fieldset>

      <fieldset>
        <legend>Date and time</legend>
        <br><label>Date</label><input id="date" type="date" name="photo" placeholder="date"><br>
        <br><label>Month</label><input id="month" type="month" name="photo" placeholder="month"><br>
      </fieldset>

      <fieldset>
        <br><Label>State</Label><input id="state" type="state" placeholder="State"><br>
        <br><Label>Country</Label><input id="country" type="Country" placeholder="Country"><br>
      </fieldset>
      <fieldset>
        <br><Label>Range</Label><input type="range" name="photo" placeholder="Range"><br>
        <br><Label>Checkbox</Label><input type="checkbox" name="photo" placeholder="Checkbox"><br>
      </fieldset>

      <fieldset>
        <legend>Form Buttons</legend><br>
        <button id="submit">Submit</button><br><br>
        <button id="reset">Reset</button><br><br>
        <br><br> <button id="Submit-button">Submit Button</button>
      </fieldset>


    </form>
  </div>
</body>

</html>
